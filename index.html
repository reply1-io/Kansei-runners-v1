<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kansei">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Kansei Runners</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,500;0,700;1,600;1,800;1,900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- One 3D view (PS1-style renderer) shared by the home screen and driving -->
  <canvas id="view"></canvas>

  <!-- Home: the cabin in the woods, with overlays -->
  <div id="world">
    <div class="map-hud">
      <span class="map-pill"><small>DAY</small> <b data-map-day></b></span>
      <span class="map-pill money"><b data-map-money></b></span>
      <button class="map-pill fs-btn" data-fullscreen aria-label="Full screen">⛶</button>
    </div>
    <div id="map-buttons"></div>
    <div class="map-hint" data-map-hint></div>
    <button id="phone-btn" data-action="phone"><span class="pb-ico">📱</span> Phone<span class="pb-dot" data-phone-dot hidden></span></button>
  </div>

  <!-- The phone: pulled out of your pocket over the map -->
  <div id="phone-wrap" hidden>
    <div id="phone">
      <div id="statusbar">
        <span data-sb-day></span>
        <button class="sb-away" data-action="closephone">▾ Put away</button>
        <span data-sb-money></span>
      </div>
      <div id="screen"></div>
      <div id="homebar" data-action="home"><span></span></div>
    </div>
  </div>

  <!-- Race view -->
  <div id="race" hidden>
    <div id="hud">
      <div class="hud-top">
        <div class="hud-pos race-only"><small data-pos-label>POSITION</small><div><b data-pos>1</b><span data-pos-of>/3</span></div></div>
        <div class="hud-time race-only"><small>TIME</small><b data-time>0:00.0</b><small data-gap-label>GAP</small><b data-gap>0m</b></div>
        <div class="hud-buttons">
          <button class="hud-exit" data-fullscreen aria-label="Full screen">⛶</button>
          <button class="hud-exit" data-mute aria-label="Sound on or off">🔊</button>
          <button class="hud-exit" data-exit>Retire</button>
        </div>
      </div>
      <canvas class="minimap" data-minimap></canvas>
      <div class="hud-togo race-only" data-togo></div>
      <div class="hud-msg" data-msg></div>
      <div class="hud-warn" data-warn></div>
      <canvas class="tach" data-tach></canvas>
      <div class="controls">
        <div class="ctl-group">
          <button class="ctl" data-ctl="left">◀</button>
          <button class="ctl" data-ctl="right">▶</button>
        </div>
        <div class="ctl-group">
          <button class="ctl brake" data-ctl="brake">BRAKE</button>
          <div class="ctl-stack">
            <button class="ctl hb" data-ctl="hb">HAND BRAKE</button>
            <button class="ctl gas" data-ctl="gas">GAS</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="modal" hidden></div>
  <div id="toast" hidden></div>

  <!-- VHS / VX1000 camcorder overlay: scanlines, vignette and the on-screen display. Never takes touches. -->
  <div id="vhs" aria-hidden="true"><div class="vhs-osd"><b>▶ PLAY</b><span>SP <span data-tc>0:00:00</span></span></div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
