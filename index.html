<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Kansei Runners</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Home map: the cabin in the woods -->
  <div id="world">
    <canvas id="map-canvas"></canvas>
    <div class="map-hud">
      <span class="map-pill"><small>DAY</small> <b data-map-day></b></span>
      <span class="map-pill money"><b data-map-money></b></span>
    </div>
    <div id="map-buttons"></div>
    <div class="map-hint" data-map-hint></div>
    <button id="phone-btn" data-action="phone"><span class="pb-ico">📱</span> Phone<span class="pb-dot" data-phone-dot hidden></span></button>
  </div>

  <!-- The phone: pulled out of your pocket over the map -->
  <div id="phone-wrap" hidden>
    <div id="phone">
      <div id="statusbar">
        <span data-sb-day></span>
        <button class="sb-away" data-action="closephone">▾ Put away</button>
        <span data-sb-money></span>
      </div>
      <div id="screen"></div>
      <div id="homebar" data-action="home"><span></span></div>
    </div>
  </div>

  <!-- Race view -->
  <div id="race" hidden>
    <canvas id="race-canvas"></canvas>
    <div id="hud">
      <div class="hud-top">
        <div class="hud-box race-only"><small>POS</small><b data-pos></b></div>
        <div class="hud-box race-only"><small>GAP</small><b data-gap></b></div>
        <div class="hud-box race-only"><small>TIME</small><b data-time></b></div>
        <button class="hud-exit" data-mute aria-label="Sound on or off">🔊</button>
        <button class="hud-exit" data-exit>Retire</button>
      </div>
      <canvas class="minimap" data-minimap></canvas>
      <div class="hud-togo race-only" data-togo></div>
      <div class="hud-msg" data-msg></div>
      <div class="hud-warn" data-warn></div>
      <div class="hud-speed"><b data-speed>0</b><small>MPH</small></div>
      <div class="controls">
        <div class="ctl-group">
          <button class="ctl" data-ctl="left">◀</button>
          <button class="ctl" data-ctl="right">▶</button>
        </div>
        <div class="ctl-group">
          <div class="ctl-stack">
            <button class="ctl brake" data-ctl="brake">BRAKE</button>
            <button class="ctl hb" data-ctl="hb">HAND<br>BRAKE</button>
          </div>
          <button class="ctl gas" data-ctl="gas">GAS</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modal" hidden></div>
  <div id="toast" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
